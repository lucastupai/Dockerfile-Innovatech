version: '3.8'

services:

  backend:
    build: ./Backend
  fronted:
    build: ./Frontend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data 
    networks:
      - web_net
      - db_net

  # Base de Datos 
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data 
    networks:
      - db_net


networks:
  web_net:
  db_net:
 

volumes:
  backend_data: 
  db_data: 